# Markdown lint scope: the docs this fork maintains and ships.
# CHANGELOG.md is generated by the release tool.
[global]
disable = ["MD013"]
exclude = ["CHANGELOG.md", "docs/superpowers/**", "node_modules/**", ".superpowers/**"]

[per-file-ignores]
# Built-in agent bodies are system prompts after YAML frontmatter, not documents.
"agents/*.md" = ["MD041"]
