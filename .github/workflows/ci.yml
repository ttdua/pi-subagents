name: CI

on:
  push:
    branches: ["**"] # tags run through release.yml
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # test/upstream.test.ts diffs against the upstream split commit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json # packageManager pins bun
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run lint:md
      - run: bun run check
      - run: bun run test
      - run: bun run verify:public-types
